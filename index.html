<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Книга - Лицо </title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        textarea {
            width: 100%; height: 200px; padding: 15px; font-size: 16px;
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px;
        }
        button {
            padding: 10px 20px; font-size: 16px; background-color: #2ea44f;
            color: white; border: none; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #2c974b; }
        #status { color: #555; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Общая доска заметок</h1>
    <p>Всё, что вы напишете и сохраните здесь, увидят все посетители сайта.</p>
    
    <div id="status">Загрузка данных с сервера...</div>
    
    <textarea id="sharedText" placeholder="Напишите что-нибудь..."></textarea>
    <button onclick="saveText()">Сохранить для всех</button>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE
        const firebaseConfig = {
  apiKey: "AIzaSyAkBvVaf0_KNZ4sVDfMtuziGCGBQwUq55E",
  authDomain: "find-dude.firebaseapp.com",
  databaseURL: "https://find-dude-default-rtdb.firebaseio.com",
  projectId: "find-dude",
  storageBucket: "find-dude.firebasestorage.app",
  messagingSenderId: "458746102805",
  appId: "1:458746102805:web:b9504c82160fca249b7a1c",
  measurementId: "G-CEKD8FWHV7"
};


        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const textRef = ref(db, 'sharedBoard/text'); // Путь, где будет храниться текст

        const textarea = document.getElementById('sharedText');
        const status = document.getElementById('status');

        // 1. Получаем текст с сервера (срабатывает при загрузке и при изменении другими)
        onValue(textRef, (snapshot) => {
            const data = snapshot.val();
            if (data !== null) {
                textarea.value = data; // Показываем текст всем
            }
            status.innerText = "Данные актуальны";
        });

        // 2. Функция сохранения текста на сервер
        window.saveText = function() {
            const newText = textarea.value;
            status.innerText = "Сохранение...";
            
            // Отправляем данные в базу
            set(textRef, newText)
                .then(() => {
                    status.innerText = "Успешно сохранено! Все видят этот текст.";
                })
                .catch((error) => {
                    status.innerText = "Ошибка: " + error.message;
                });
        }
    </script>

</body>
</html>
