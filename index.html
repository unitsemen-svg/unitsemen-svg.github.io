<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Мой сайт с заметками</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2ea44f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <h1>Мои заметки</h1>
    <p>Пишите здесь. Текст сохранится автоматически, даже если вы закроете страницу.</p>
    
    <!-- Это поле для ввода текста -->
    <textarea id="myTextarea" placeholder="Начните печатать здесь..."></textarea>
    
    <br>
    <button onclick="clearText()">Очистить текст</button>

    <script>
        // 1. Загружаем сохраненный текст при открытии страницы
        const textarea = document.getElementById('myTextarea');
        const savedText = localStorage.getItem('myWebsiteText');
        
        if (savedText) {
            textarea.value = savedText;
        }

        // 2. Сохраняем текст при каждом нажатии клавиши
        textarea.addEventListener('input', function() {
            localStorage.setItem('myWebsiteText', textarea.value);
        });

        // 3. Функция для очистки текста
        function clearText() {
            if(confirm("Вы уверены, что хотите удалить весь текст?")) {
                textarea.value = '';
                localStorage.removeItem('myWebsiteText');
            }
        }
    </script>

</body>
</html>
