<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный Мессенджер</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #e5e5ea; height: 100vh; display: flex; flex-direction: column; }
        
        /* Экран входа */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: white; }
        #login-screen input { padding: 10px; font-size: 18px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; max-width: 300px; }
        #login-screen button { padding: 10px 20px; font-size: 18px; background: #007aff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; max-width: 300px; }
        
        /* Основной интерфейс чата */
        #chat-screen { display: none; height: 100vh; flex-direction: row; }
        
        /* Левая панель (контакты) */
        #sidebar { width: 250px; background: #f8f9fa; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #sidebar h3 { margin: 0; padding: 15px; background: #007aff; color: white; text-align: center; font-size: 18px; }
        #my-name-display { padding: 10px; font-size: 14px; border-bottom: 1px solid #ccc; color: #555; }
        #contacts-list { flex: 1; overflow-y: auto; }
        .contact { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; font-weight: bold; color: #333; }
        .contact:hover { background: #e2e6ea; }
        .contact.active { background: #dcf8c6; border-left: 4px solid #2ea44f; }
        
        /* Правая панель (чат) */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        #chat-header { background: #fff; padding: 15px; border-bottom: 1px solid #ccc; font-weight: bold; font-size: 18px; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 70%; font-size: 15px; word-wrap: break-word; }
        .my-msg { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .other-msg { background: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; }
        #input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; }
        #input-area button { padding: 12px 20px; background: #007aff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 600px) {
            #chat-screen { flex-direction: column; }
            #sidebar { width: 100%; height: 35vh; flex: none; }
            #chat-area { height: 65vh; }
        }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen">
        <h2>Вход в Мессенджер</h2>
        <input type="text" id="username-input" placeholder="Введите ваше имя (например, Иван)">
        <button onclick="login()">Войти</button>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen">
        <div id="sidebar">
            <h3>Контакты</h3>
            <div id="my-name-display"></div>
            <div id="contacts-list"></div>
        </div>
        
        <div id="chat-area">
            <div id="chat-header">Выберите контакт...</div>
            <div id="messages"></div>
            <div id="input-area" style="display: none;">
                <input type="text" id="message-input" placeholder="Сообщение...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
            databaseURL: "https://ВАШ_ПРОЕКТ-default-rtdb.firebaseio.com",
            projectId: "ВАШ_ПРОЕКТ",
            storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ВАШ_ID",
            appId: "ВАШ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Переменные состояния
        let currentUser = "";
        let currentChatPartner = "";
        let currentRoomId = "";
        let messagesListener = null; // Чтобы отписываться от старых чатов

        // Список контактов (для примера)
        const contacts = ["Иван", "Петр", "Анна", "Мария"];
        const chatContainer = document.getElementById('messages');
        const contactsList = document.getElementById('contacts-list');
        const header = document.getElementById('chat-header');
        const inputArea = document.getElementById('input-area');
        const messageInput = document.getElementById('message-input');

        // 1. Вход
        window.login = function() {
            const name = document.getElementById('username-input').value.trim();
            if (name.length < 2) return alert("Введите имя подлиннее");
            
            currentUser = name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('my-name-display').innerText = "Вы: " + currentUser;
            
            renderContacts();
        };

        // 2. Отрисовка контактов
        function renderContacts() {
            contactsList.innerHTML = "";
            contacts.forEach(contact => {
                if (contact === currentUser) return; // Не показываем себя
                
                const div = document.createElement('div');
                div.className = 'contact';
                div.innerText = contact;
                div.onclick = () => openChat(contact, div);
                contactsList.appendChild(div);
            });
        }

        // 3. Открытие чата с конкретным человеком
        function openChat(partner, element) {
            // Подсветка активного контакта
            document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            currentChatPartner = partner;
            header.innerText = "Чат с " + partner;
            inputArea.style.display = 'flex';
            chatContainer.innerHTML = ""; // Очищаем экран
            
            // Формируем уникальный ID комнаты (сортируем имена по алфавиту, чтобы у обоих был один ID)
            // Например, "Иван" и "Петр" -> комната "Иван_Петр"
            const roomUsers = [currentUser, currentChatPartner].sort();
            currentRoomId = "chat_" + roomUsers[0] + "_" + roomUsers[1];
            
            const chatRef = ref(db, 'chats/' + currentRoomId);

            // Отписываемся от предыдущего чата (если был открыт)
            if (messagesListener) messagesListener(); 

            // Слушаем сообщения
            messagesListener = onChildAdded(chatRef, (data) => {
                const msg = data.val();
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (msg.sender === currentUser ? 'my-msg' : 'other-msg');
                msgDiv.innerHTML = `<b style="font-size:12px;color:#666;display:block;margin-bottom:2px;">${msg.sender}</b> ${msg.text}`;
                chatContainer.appendChild(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight; // Прокрутка вниз
            });
        }

        // 4. Отправка сообщения
        window.sendMessage = function() {
            const text = messageInput.value.trim();
            if (text === "" || currentRoomId === "") return;

            push(ref(db, 'chats/' + currentRoomId), {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                messageInput.value = "";
            }).catch(err => alert("Ошибка: " + err.message));
        };

        // Отправка по Enter
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
