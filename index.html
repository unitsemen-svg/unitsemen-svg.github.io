<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Соцсеть</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #e5e5ea; height: 100vh; display: flex; flex-direction: column; }
        
        /* Экран входа */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: white; padding: 20px; }
        #auth-screen input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #auth-screen button { width: 100%; max-width: 300px; padding: 12px; background: #007aff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        #auth-screen button.secondary { background: #6c757d; }
        #auth-error { color: red; font-size: 14px; margin-bottom: 10px; text-align: center; }

        /* Основной интерфейс */
        #chat-screen { display: none; height: 100vh; flex-direction: row; }
        
        /* Левая панель */
        #sidebar { width: 280px; background: #f8f9fa; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #sidebar h3 { margin: 0; padding: 15px; background: #007aff; color: white; text-align: center; font-size: 16px; }
        #my-name-display { padding: 10px; font-size: 14px; border-bottom: 1px solid #ccc; background: #e2e6ea; display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        
        /* Кнопка поиска */
        #search-btn { margin: 10px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #search-btn:hover { background: #218838; }

        /* Списки */
        #contacts-list, #all-users-list { flex: 1; overflow-y: auto; }
        .list-title { padding: 10px; font-size: 12px; color: #666; text-transform: uppercase; font-weight: bold; background: #e9ecef; border-bottom: 1px solid #ccc; }
        
        .contact { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-weight: bold; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .contact:hover { background: #e2e6ea; }
        .contact.active { background: #dcf8c6; border-left: 4px solid #2ea44f; }
        .status-online { font-size: 12px; color: #28a745; }

        /* Правая панель (чат) */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        #chat-header { background: #fff; padding: 15px; border-bottom: 1px solid #ccc; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 70%; font-size: 15px; word-wrap: break-word; }
        .my-msg { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .other-msg { background: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; }
        #input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #input-area button { padding: 12px 20px; background: #007aff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        
        @media (max-width: 600px) {
            #chat-screen { flex-direction: column; }
            #sidebar { width: 100%; height: 45vh; flex: none; }
            #chat-area { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Экран Входа / Регистрации -->
    <div id="auth-screen">
        <h2>Добро пожаловать</h2>
        <div id="auth-error"></div>
        <input type="text" id="reg-username" placeholder="Придумайте ник (латиница)">
        <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)">
        <button onclick="register()">Зарегистрироваться</button>
        <button class="secondary" onclick="login()">Войти</button>
    </div>

    <!-- Экран Соцсети -->
    <div id="chat-screen">
        <div id="sidebar">
            <h3>Моя Соцсеть</h3>
            <div id="my-name-display">
                <span id="my-username"></span>
                <button id="logout-btn" onclick="logout()">Выйти</button>
            </div>
            
            <!-- Кнопка поиска -->
            <button id="search-btn" onclick="toggleSearch()">🔍 Поиск людей</button>
            
            <div id="contacts-list">
                <div class="list-title">Мои контакты</div>
            </div>
            
            <div id="all-users-list" style="display: none;">
                <div class="list-title" style="background:#d1ecf1; color:#0c5460;">Все пользователи</div>
            </div>
        </div>
        
        <div id="chat-area">
            <div id="chat-header">Выберите контакт...</div>
            <div id="messages"></div>
            <div id="input-area" style="display: none;">
                <input type="text" id="message-input" placeholder="Сообщение...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE
        const firebaseConfig = { 
  apiKey : "AIzaSyAkBvVaf0_KNZ4sVDfMtuziGCGBQwUq55E" , 
  authDomain : "find-dude.firebaseapp.com" , 
  databaseURL : "https://find-dude-default-rtdb.firebaseio.com" , 
  projectId : "find-dude" , 
  storageBucket : "find-dude.firebasestorage.app" , 
  messagingSenderId : "458746102805" , 
  appId : "1:458746102805:web:b9504c82160fca249b7a1c" , 
  measurementId : "G-CEKD8FWHV7" 
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        const emailDomain = "@mysite.com";
        let currentUser = "";
        let currentRoomId = "";
        let messagesListener = null;
        let allUsers = []; // Массив для хранения всех людей
        
        const chatContainer = document.getElementById('messages');
        const contactsList = document.getElementById('contacts-list');
        const allUsersList = document.getElementById('all-users-list');
        const header = document.getElementById('chat-header');
        const inputArea = document.getElementById('input-area');
        const errorDiv = document.getElementById('auth-error');
        const searchBtn = document.getElementById('search-btn');

        // 1. РЕГИСТРАЦИЯ
        window.register = async function() {
            const user = document.getElementById('reg-username').value.trim().toLowerCase();
            const pass = document.getElementById('reg-password').value;
            errorDiv.innerText = "";

            if (user.length < 3) return errorDiv.innerText = "Ник должен быть больше 3 символов";
            if (pass.length < 6) return errorDiv.innerText = "Пароль должен быть больше 6 символов";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, user + emailDomain, pass);
                await set(ref(db, 'users/' + userCredential.user.uid), { username: user });
                alert("Успешная регистрация!");
            } catch (error) {
                errorDiv.innerText = "Ошибка: " + (error.code === 'auth/email-already-in-use' ? "Этот ник уже занят" : error.message);
            }
        };

        // 2. ВХОД
        window.login = async function() {
            const user = document.getElementById('reg-username').value.trim().toLowerCase();
            const pass = document.getElementById('reg-password').value;
            errorDiv.innerText = "";

            try {
                await signInWithEmailAndPassword(auth, user + emailDomain, pass);
            } catch (error) {
                errorDiv.innerText = "Неверный ник или пароль";
            }
        };

        // 3. ВЫХОД
        window.logout = function() {
            signOut(auth);
        };

        // 4. ПРОВЕРКА АВТОРИЗАЦИИ
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user.email.replace(emailDomain, "");
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('my-username').innerText = "Вы: " + currentUser;
                loadAllUsers(); // Загружаем всех людей при входе
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('chat-screen').style.display = 'none';
                document.getElementById('reg-username').value = "";
                document.getElementById('reg-password').value = "";
            }
        });

        // 5. ПЕРЕКЛЮЧАТЕЛЬ ПОИСКА
        window.toggleSearch = function() {
            if (allUsersList.style.display === 'none') {
                allUsersList.style.display = 'block';
                contactsList.style.display = 'none';
                searchBtn.innerText = "⬅ Назад к контактам";
                searchBtn.style.background = "#6c757d";
            } else {
                allUsersList.style.display = 'none';
                contactsList.style.display = 'block';
                searchBtn.innerText = "🔍 Поиск людей";
                searchBtn.style.background = "#28a745";
            }
        };

        // 6. ЗАГРУЗКА ВСЕХ ПОЛЬЗОВАТЕЛЕЙ
        function loadAllUsers() {
            const usersRef = ref(db, 'users');
            get(usersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    allUsers = []; // Очищаем старый список
                    const data = snapshot.val();
                    for (const key in data) {
                        const username = data[key].username;
                        if (username !== currentUser) {
                            allUsers.push(username);
                            
                            // Отрисовываем в "Все пользователи"
                            const divAll = document.createElement('div');
                            divAll.className = 'contact';
                            divAll.innerHTML = `${username} <span class="status-online">в сети</span>`;
                            divAll.onclick = () => {
                                addToContacts(username); // Добавляем в контакты при клике
                                openChat(username, divAll);
                                toggleSearch(); // Скрываем поиск
                            };
                            allUsersList.appendChild(divAll);
                        }
                    }
                } else {
                    allUsersList.innerHTML = "<div style='padding:10px;color:#888'>Пока никого нет...</div>";
                }
            });
        }

        // 7. ДОБАВЛЕНИЕ В КОНТАКТЫ (визуально)
        function addToContacts(username) {
            // Проверяем, есть ли уже такой контакт в списке
            const existing = Array.from(contactsList.children).find(el => el.dataset.name === username);
            if (!existing) {
                const div = document.createElement('div');
                div.className = 'contact';
                div.dataset.name = username;
                div.innerText = username;
                div.onclick = () => openChat(username, div);
                contactsList.appendChild(div);
            }
        }

        // 8. ОТКРЫТИЕ ЧАТА
        function openChat(partner, element) {
            // Убираем активный класс со всех
            document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            header.innerText = "Чат с " + partner;
            inputArea.style.display = 'flex';
            chatContainer.innerHTML = "";
            
            const roomUsers = [currentUser, partner].sort();
            currentRoomId = "chat_" + roomUsers[0] + "_" + roomUsers[1];
            
            const chatRef = ref(db, 'chats/' + currentRoomId);
            if (messagesListener) messagesListener(); 

            messagesListener = onChildAdded(chatRef, (data) => {
                const msg = data.val();
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (msg.sender === currentUser ? 'my-msg' : 'other-msg');
                msgDiv.innerHTML = `<b style="font-size:12px;color:#666;display:block;">${msg.sender}</b> ${msg.text}`;
                chatContainer.appendChild(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        // 9. ОТПРАВКА СООБЩЕНИЯ
        window.sendMessage = function() {
            const text = document.getElementById('message-input').value.trim();
            if (text === "" || currentRoomId === "") return;

            push(ref(db, 'chats/' + currentRoomId), {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('message-input').value = "";
            }).catch(err => alert("Ошибка: " + err.message));
        };

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
